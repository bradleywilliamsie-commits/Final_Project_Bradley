<body>
    
<div style="padding-top: 10px;">
    <h1 style="text-align: center;">AI-Powered Text Summarizer</h1>
    <p style="text-align: center; color: white;">Summarize long text into concise and clear summaries! </p>
</div>


<div class="content-row">
    <div class="container1">
        <h2>Make Your School Life Easier!</h2>
        <p>Enhance your learning! Instantly get a summary of your study material!</p>
        <textarea id="userinput"  rows="15">
        </textarea>
        <br>
        <br>
        <button class="button" id="summarizebutton" onclick="gettextareavalue">Summarize</button>
    </div>

    <div class="container2">
        <h2 style="text-align: center;">Summary</h2>
        <p>Here's a summary of your input: </p>
        <br>
        <textarea id="resulttextarea" rows="15">
        </textarea>
    </div>
</div>
<div id="answer"></div>
<script type="importmap">
    {
      "imports": {
        "@google/generative-ai": "https://esm.run/@google/generative-ai"
      }
    }
  </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js" integrity="sha512-LhccdVNGe2QMEfI3x4DVV3ckMRe36TfydKss6mJpdHjNFiV07dFpS2xzeZedptKZrwxfICJpez09iNioiSZ3hA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<!-- Import @google/generative-ai, as shown above. -->
<script type="module">
import { GoogleGenerativeAI } from "@google/generative-ai";

// Fetch your API_KEY
const API_KEY = "AQ.Ab8RN6L6sfBEahEn9BZGKFCoPMkDApv4ATALSSfPw0uCboWXKA";

// Access your API key
const genAI = new GoogleGenerativeAI(API_KEY);
const model = genAI.getGenerativeModel({ model: "gemini-3.6-flash"});

async function ask(prompt) {
    const model = genAI.getGenerativeModel({ model: "gemini-3.6-flash"});
    const result = await model.generateContent(prompt);
    const response = await result.response;
    const text = response.text();
    return text;
    //let convertedText = new showdown.Converter().makeHtml(text);
    //return convertedText;
}

// get value from text area
function gettextareavalue() {
    // Get the value of the textarea with id="userinput"
    var textareaValue = document.getElementById("userinput").value;
    console.log(textareaValue); // This will log the value to the console
}


// generate summarization
async function generateSummarization() {
let textareaValue = document.getElementById("userinput").value;
let sum_result = await ask("Please create a short summary of the given text in one short paragraph with 5 sentences. Only keep the main points, and use bullet points if needed." + textareaValue);
document.getElementById("resulttextarea").value = sum_result;
}

document.getElementById("summarizebutton").addEventListener("click", generateSummarization);
</script>
